name: CI Build

on:
  push:
    branches: [ main, cmake-port ]
  pull_request:
    branches: [ main, cmake-port ]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest]
        build_type: [debug, release]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libpcap-dev \
          libsnmp-dev

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install \
          autoconf \
          automake \
          libtool \
          pkg-config \
          libpcap \
          net-snmp

    - name: Make build scripts executable
      run: chmod +x scripts/build/*.sh

    - name: Configure Debug Build
      if: matrix.build_type == 'debug'
      run: ./scripts/build/config-cmake-debug.sh

    - name: Configure Release Build
      if: matrix.build_type == 'release'
      run: ./scripts/build/config-cmake-release.sh

    - name: Build Debug
      if: matrix.build_type == 'debug'
      run: |
        cd build-cmake/debug
        make clean
        make -j$(nproc 2>/dev/null || echo 4)

    - name: Build Release
      if: matrix.build_type == 'release'
      run: |
        cd build-cmake/release
        make clean
        make -j$(nproc 2>/dev/null || echo 4)

    - name: Test binary (Debug)
      if: matrix.build_type == 'debug'
      run: |
        build-cmake/debug/src/ptpd2 --version
        build-cmake/debug/src/ptpd2 --help

    - name: Test binary (Release)
      if: matrix.build_type == 'release'
      run: |
        build-cmake/release/src/ptpd2 --version
        build-cmake/release/src/ptpd2 --help

    - name: Upload Debug Binary
      if: matrix.build_type == 'debug'
      uses: actions/upload-artifact@v4
      with:
        name: ptpd2-debug-${{ matrix.os }}
        path: build-cmake/debug/src/ptpd2
        retention-days: 30

    - name: Upload Release Binary
      if: matrix.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ptpd2-release-${{ matrix.os }}
        path: build-cmake/release/src/ptpd2
        retention-days: 30
