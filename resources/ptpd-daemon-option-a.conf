; ptpd-daemon-option-a.conf
; Option A - Pure proportional control (no integral)
; kp=1.0 (aggressive proportional), ki=0.0 (disable integral)
; Rationale: ptpd feeds swclock which has its own PI servo.
; The outer (ptpd) loop should act as a pure proportional corrector
; and let swclock handle steady-state drift elimination.
; Expected: faster phase convergence, no integrator windup interaction.

ptpengine:interface=en5
ptpengine:domain=0
ptpengine:preset=slaveonly
ptpengine:ip_mode=multicast
ptpengine:transport=ipv4
ptpengine:always_respect_utc_offset=y
ptpengine:delay_mechanism       = E2E
ptpengine:announce_receipt_timeout = 3
ptpengine:log_announce_interval = 1
ptpengine:log_sync_interval     = 0
ptpengine:log_delayreq_interval = 0

; Logging configuration
global:log_file=/tmp/ptpd_option_a.log
global:log_level=LOG_ALL
global:use_syslog=n
global:verbose_foreground=n

; Statistics and monitoring
global:statistics_file=/tmp/ptpd_option_a.csv
global:log_statistics=y

; Clock stepping behavior
clock:no_adjust=N
clock:drift_handling=reset
clock:step_startup=y
clock:step_startup_force=y

; Servo: pure proportional, 10x kp vs baseline.
; ptpd servo input is in nanoseconds, so kp has units of ppb/ns.
; kp=0.1 → 100 ppb per 1µs error (vs 10 ppb at baseline kp=0.01).
; ki near-zero to test proportional-only response without integrator interaction.
servo:kp=0.1
servo:ki=0.000001
