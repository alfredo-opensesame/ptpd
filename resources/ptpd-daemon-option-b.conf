; ptpd-daemon-option-b.conf
; Option B - Balanced PI with moderate gains
; kp=0.7 (moderate proportional), ki=0.3 (moderate integral)
; Rationale: moderate PI that can correct both phase error (kp) and
; accumulated drift bias (ki) without over-driving swclock.
; Expected: good convergence + bias correction, potentially noisier
; than option A but more robust to sustained frequency offsets.

ptpengine:interface=en5
ptpengine:domain=0
ptpengine:preset=slaveonly
ptpengine:ip_mode=multicast
ptpengine:transport=ipv4
ptpengine:always_respect_utc_offset=y
ptpengine:delay_mechanism       = E2E
ptpengine:announce_receipt_timeout = 3
ptpengine:log_announce_interval = 1
ptpengine:log_sync_interval     = 0
ptpengine:log_delayreq_interval = 0

; Logging configuration
global:log_file=/tmp/ptpd_option_b.log
global:log_level=LOG_ALL
global:use_syslog=n
global:verbose_foreground=n

; Statistics and monitoring
global:statistics_file=/tmp/ptpd_option_b.csv
global:log_statistics=y

; Clock stepping behavior
clock:no_adjust=N
clock:drift_handling=reset
clock:step_startup=y
clock:step_startup_force=y

; Servo: 10x kp + 10x ki vs baseline.
; kp=0.1 for faster phase correction, ki=0.001 for faster bias elimination.
; ki=0.001 → ~300 ppb integrator growth per second at 300µs offset
; (vs 30 ppb/s at baseline ki=0.0001), reaching steady-state ~10x faster.
servo:kp=0.1
servo:ki=0.001
